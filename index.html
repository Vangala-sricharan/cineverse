<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Title & Standard Meta Tags -->
    <title>CINEVERSE — Not just movies. Experiences.</title>
    <meta name="description" content="Discover movies matching your mood, taste, and cinematic DNA. Personalized recommendations, natural language search, and deep cinematic insights." />
    <meta name="keywords" content="movies, cinematic discovery, movie recommendations, Movie DNA, mood search, Telugu movies, cinema" />
    <meta name="author" content="CINEVERSE" />
    <meta name="theme-color" content="#07080b" />
    <link rel="canonical" href="https://cineverse.app" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cineverse.app" />
    <meta property="og:title" content="CINEVERSE — Not just movies. Experiences." />
    <meta property="og:description" content="Discover movies matching your mood, taste, and cinematic DNA. Personalized recommendations and natural-language discovery." />
    <meta property="og:site_name" content="CINEVERSE" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CINEVERSE — Not just movies. Experiences." />
    <meta name="twitter:description" content="Discover movies matching your mood, taste, and cinematic DNA. Personalized recommendations and natural-language discovery." />

    <!-- JSON-LD Structured Data for Rich Search Results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CINEVERSE",
        "url": "https://cineverse.app",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "All",
        "description": "Premium cinematic movie discovery and recommendation platform designed to help users discover movies matching their mood, taste, and viewing context.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Typography Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#07080b] text-slate-100 antialiased selection:bg-[#ff2a5f]/40 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
